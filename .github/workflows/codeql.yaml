name: AI Terraform Security CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:

  # ==========================================
  # JOB 1: Terraform Security - Checkov
  # ==========================================
  terraform-security:
    name: 1. Checkov Terraform Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          pip install checkov

      - name: Run Checkov
        run: |
          checkov -d examples --framework terraform --soft-fail


  # ==========================================
  # JOB 2: CodeQL
  # ==========================================
  codeql:
    name: 2. CodeQL Python Security
    runs-on: ubuntu-latest

    needs: terraform-security

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # ==========================================
  # JOB 3: AI Terraform Security Review
  # ==========================================
  ai-review:
    name: 3. AI Terraform Security Review
    runs-on: ubuntu-latest

    needs: codeql

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Terraform Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m auditor.auditor examples/vulnerable.tf


  # ==========================================
  # JOB 4: Final Security Gate
  # ==========================================
  security-gate:
    name: 4. Final Security Gate
    runs-on: ubuntu-latest

    needs: ai-review

    steps:
      - name: Security Gate
        run: |
          echo "======================================"
          echo "     AI TERRAFORM SECURITY GATE"
          echo "======================================"
          echo "Checkov : PASSED"
          echo "CodeQL  : PASSED"
          echo "AI Review : PASSED"
          echo "======================================"
          echo "Security Gate PASSED"